services:
  - type: web
    name: road-safety-zambia
    repo: https://github.com/henrysoopu-droid/road-safety-zambia.git
    branch: main
    autoDeployTrigger: commit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: SITE_URL
        value: https://road-safety-zambia.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: road-safety-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/uploads
      - key: MODEL_DIR
        value: instance/models
      - key: TRAFFIC_SIGN_MODEL
        value: yolov8s-best.pt
      - key: MAX_EXTRACTED_FRAMES
        value: "500"
      - key: TRAFFIC_SIGN_IMAGE_SIZE
        value: "416"
      - key: TRAFFIC_SIGN_MAX_DETECTIONS
        value: "50"
      - key: TRAFFIC_SIGN_CPU_THREADS
        value: "1"

databases:
  - name: road-safety-db
    databaseName: road_safety
    user: road_safety